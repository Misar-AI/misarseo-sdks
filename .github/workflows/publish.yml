name: Publish SDK

# Fires on a per-SDK release tag: `<language>/vX.Y.Z`, e.g. `python/v1.0.0`.
# auto-tag.yml creates these from a manifest version bump; you can also push one
# by hand.
#
# Per-SDK tags rather than one fleet-wide version, so a Ruby fix does not burn a
# version number in eleven other registries. Tag-triggered rather than
# push-triggered because every registry here treats a published version as
# PERMANENT: npm's unpublish window is 72 hours, crates.io and the Go module
# proxy are immutable outright, and Maven Central has no delete at all.
#
# One file rather than twelve near-identical ones. The TAG CONVENTION matches
# misarmail-sdks and misarblog-sdks exactly — that is the part Go and the
# tooling actually depend on — but the twelve jobs share a single gate and a
# single place to fix a bug.
#
# Two registries need no stored credential here, because GitHub is a supported
# OIDC provider for both: PyPI Trusted Publishing and pub.dev automated
# publishing. That is a real security win over a self-hosted runner, where both
# would require a long-lived token sitting in a secret store.

on:
  push:
    tags: ["*/v*", "v*"] # bare v* is the Swift PM release tag
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK to publish"
        required: true
        type: choice
        options:
          [
            typescript,
            cli,
            python,
            rust,
            ruby,
            dart,
            flutter,
            java,
            kotlin,
            csharp,
            go,
            swift,
            php,
          ]
      version:
        description: "Version (must match the manifest)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────────
  # Runs before any credential is touched, so a bad tag costs seconds and has
  # published nothing.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.parse.outputs.sdk }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: parse
        # Event data reaches the shell through env, never by ${{ }}
        # interpolation into the script: `version` is free text, so
        # interpolating it would let a dispatch input run shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SDK: ${{ inputs.sdk }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SDK="$INPUT_SDK"; VERSION="$INPUT_VERSION"
          else
            REF="${GITHUB_REF#refs/tags/}"
            if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              # A bare semver tag is the Swift release: Swift PM reads versions
              # from the repository root and does not accept a prefixed tag.
              SDK="swift"; VERSION="${BASH_REMATCH[1]}"
            elif [[ "$REF" =~ ^([a-z]+)/v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              SDK="${BASH_REMATCH[1]}"; VERSION="${BASH_REMATCH[2]}"
            else
              echo "::error::Tag '$REF' matches neither <language>/vX.Y.Z nor vX.Y.Z"
              exit 1
            fi
          fi

          KNOWN="typescript cli python rust ruby dart flutter java kotlin csharp go swift php"
          if [[ " $KNOWN " != *" $SDK "* ]]; then
            echo "::error::Unknown SDK '$SDK'"; exit 1
          fi

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $SDK $VERSION"

      # Refuses on a version/manifest mismatch, a missing LICENSE or README, a
      # publicly-404ing manifest URL, or a manifest no parser accepts.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - run: node scripts/check-sdk-release.mjs "${{ steps.parse.outputs.sdk }}" "${{ steps.parse.outputs.version }}"

  npm:
    needs: resolve
    # @misarseo/sdk (typescript/) and @misarseo/cli (cli/) both go to npm.
    if: needs.resolve.outputs.sdk == 'typescript' || needs.resolve.outputs.sdk == 'cli'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: "${{ needs.resolve.outputs.sdk }}" } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      # tsc is incremental; a stale dist/ silently ships old code.
      - run: rm -rf dist && npm run typecheck && npm test && npm run build
      - run: npm pack --dry-run
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Trusted Publishing — no API token is stored anywhere
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet build twine
      - run: python -m build
        working-directory: python
      - run: twine check python/dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/dist

  crates:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'rust'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned by SHA, so the toolchain must be named (it is otherwise read from the ref).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - run: cargo test
      - run: cargo publish --dry-run
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  rubygems:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'ruby'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ruby } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with: { ruby-version: "3.3" }
      - run: gem build misarseo.gemspec
      - name: Publish
        run: |
          set -euo pipefail
          mkdir -p ~/.gem
          touch ~/.gem/credentials && chmod 0600 ~/.gem/credentials
          printf -- '---\n:rubygems_api_key: %s\n' "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          gem push ./*.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - if: always()
        run: rm -f ~/.gem/credentials

  nuget:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'csharp'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: csharp } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build --configuration Release
      - run: dotnet pack --configuration Release --output ./nupkg
      - run: dotnet nuget push "./nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  pub:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'dart' || needs.resolve.outputs.sdk == 'flutter'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # pub.dev automated publishing — no credentials file
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - run: dart pub get
        working-directory: ${{ needs.resolve.outputs.sdk }}
      - run: dart pub publish --dry-run
        working-directory: ${{ needs.resolve.outputs.sdk }}
      - run: dart pub publish --force
        working-directory: ${{ needs.resolve.outputs.sdk }}

  maven:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'java' || needs.resolve.outputs.sdk == 'kotlin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          # Central validates every signature against public keyservers and
          # rejects anything unsigned, so this is a hard requirement.
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - if: needs.resolve.outputs.sdk == 'java'
        # Sources, javadoc, GPG signing and the Central upload live in the
        # `release` profile so a plain `mvn test` stays local.
        run: mvn --batch-mode -Prelease clean deploy
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - if: needs.resolve.outputs.sdk == 'kotlin'
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - if: needs.resolve.outputs.sdk == 'kotlin'
        run: gradle publishToMavenCentral --no-daemon
        working-directory: kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  # ── Go: validate only ──────────────────────────────────────────────────────
  # There is nothing to upload. proxy.golang.org serves the module straight from
  # this repo's git tag, so the tag IS the release. All this job can usefully do
  # is prove the tagged tree compiles before anyone fetches it — and warm the
  # proxy so the first `go get` is instant rather than a cold fetch.
  go:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "stable" }
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: go
      - name: Warm the module proxy
        run: |
          curl -sS "https://proxy.golang.org/github.com/!misar-!a!i/misarseo-sdks/go/@v/go%2Fv${{ needs.resolve.outputs.version }}.info" \
            || echo "not indexed yet — the proxy will fetch on first use"

  # ── Swift: validate only ───────────────────────────────────────────────────
  # Swift PM consumers depend on this git URL directly; the tag is the release.
  # Package.swift must sit at the REPOSITORY ROOT, which is the whole reason this
  # mirror repo exists.
  swift:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'swift'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift build
      - run: swift test

  # ── PHP: ask Packagist to re-crawl ─────────────────────────────────────────
  # Packagist reads composer.json from this repo and derives versions from tags.
  # No upload, no publish credential — the token below only makes it re-crawl
  # now instead of on its own schedule.
  php:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'php'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger re-crawl
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_API_TOKEN:-}" ]; then
            echo "PACKAGIST_API_TOKEN not set — Packagist will pick the tag up on its own schedule."
            exit 0
          fi
          curl -sS -XPOST -H'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/misarai/misarseo-php"}}'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
